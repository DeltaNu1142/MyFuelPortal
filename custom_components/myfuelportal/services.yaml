backfill_energy_statistics:
  name: Backfill energy statistics (approximate)
  description: >-
    Runs the estimated-consumption import on demand. This already runs
    automatically on every poll; use the action to backfill immediately (e.g.
    right after install) instead of waiting for the next poll. It estimates
    historical propane consumption from your delivery history and imports it as a
    gas-consumption statistic, plus a matching "<tank> Estimated Cost" statistic
    (each day priced at that fill's $/gal). The estimate is APPROXIMATE: it
    spreads each delivery's gallons evenly across the days since the previous
    delivery (a smooth daily average, not the real burn curve) and covers the span
    between your first and last deliveries. To use it, add a Gas source under
    Settings -> Energy with the "<tank> Estimated Consumption" statistic for
    consumption and the "<tank> Estimated Cost" statistic as the total-costs
    entity. The Energy dashboard sums sources, so don't also add the live
    Cumulative Usage sensor as a gas source, or the overlap is double-counted.
